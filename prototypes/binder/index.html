<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Kanto favourites · Binder prototype</title>
    <link rel="stylesheet" href="./binder.css" />
    <script src="./binder.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Collect</div>
        <span class="demo-label"><span></span> Local prototype</span>
      </div>
    </header>
    <main>
      <header class="collection-header">
        <div>
          <p class="breadcrumb">Collections <span aria-hidden="true">/</span> Collection detail</p>
          <h1>Kanto favourites</h1>
          <p class="collection-summary">
            <span id="owned-count"></span> · Scarlet &amp; Violet—151
          </p>
        </div>
        <div class="segmented view-toggle" role="group" aria-label="Collection view">
          <button type="button" data-view="list" aria-pressed="false">
            <svg aria-hidden="true"><use href="#icon-list" /></svg> List
          </button>
          <button type="button" data-view="binder" aria-pressed="true">
            <svg aria-hidden="true"><use href="#icon-book" /></svg> Binder
          </button>
        </div>
      </header>
      <section id="binder-view" aria-label="Binder view">
        <div class="binder-toolbar">
          <div class="format-control">
            <span>Pockets per page</span>
            <div class="segmented" role="group" aria-label="Pockets per page">
              <button type="button" data-size="4" aria-pressed="false">
                4 <small>2 × 2</small>
              </button>
              <button type="button" data-size="9" aria-pressed="true">
                9 <small>3 × 3</small>
              </button>
            </div>
          </div>
          <div class="edit-controls">
            <button type="button" class="button quiet" id="undo" disabled>
              <svg aria-hidden="true"><use href="#icon-undo" /></svg> Undo
            </button>
            <button type="button" class="button" id="add-pages">
              <svg aria-hidden="true"><use href="#icon-plus" /></svg> Add pages
            </button>
          </div>
        </div>
        <div class="binder-stage">
          <div class="binder-book" id="book" aria-label="Binder pockets"></div>
          <div class="page-nav" aria-label="Turn pages">
            <button
              type="button"
              class="button page-arrow"
              id="previous"
              aria-label="Previous pages"
            >
              <svg aria-hidden="true"><use href="#icon-left" /></svg>
            </button>
            <p id="page-count" aria-live="polite"></p>
            <button type="button" class="button page-arrow" id="next" aria-label="Next pages">
              <svg aria-hidden="true"><use href="#icon-right" /></svg>
            </button>
          </div>
        </div>
        <section class="tray" id="tray" aria-labelledby="tray-title">
          <div class="tray-heading">
            <div>
              <h2 id="tray-title">Unplaced cards <span id="tray-count" class="count"></span></h2>
              <p id="instruction">Drag a card into a pocket, or select a card and then a pocket.</p>
            </div>
            <button type="button" class="button" id="return-card" hidden>Return to tray</button>
          </div>
          <div class="tray-cards" id="tray-cards"></div>
        </section>
      </section>
      <section id="list-view" aria-label="Collection cards" hidden>
        <ul class="card-list" id="card-list"></ul>
      </section>
      <footer>
        <p>
          Sample collection · Layouts saved in this browser · Card images from
          <a href="https://tcgdex.dev/">TCGdex</a>
        </p>
        <button type="button" id="reset" class="text-button">Reset demo</button>
      </footer>
      <p id="announcement" class="visually-hidden" role="status"></p>
    </main>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-list" viewBox="0 0 24 24">
        <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />
      </symbol>
      <symbol id="icon-book" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="M12 5v14" />
      </symbol>
      <symbol id="icon-undo" viewBox="0 0 24 24">
        <path d="M9 14l-5-5 5-5M4 9h10a5 5 0 0 1 0 10h-2" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="icon-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
    </svg>
  </body>
</html>
